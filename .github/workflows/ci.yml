name: Kotlin Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run FileLoaderTests
        run: ./gradlew :app:test --tests "*FileLoaderServiceTest"

      - name: Run XmlReaderTests
        run: ./gradlew :app:test --tests "*XmlReaderServiceTest"

      - name: Run simulated DatabaseServiceTests
        run: ./gradlew :app:test --tests "*DatabaseServiceTest"

      - name: Run simulated PostgreReaderTests
        run: ./gradlew :app:test --tests "*PostgreReaderServiceTest"

      - name: Run simulated PostgreWriterTests
        run: ./gradlew :app:test --tests "*PostgreWriterServiceTest"

      - name: Run MapperTests
        run: ./gradlew :app:test --tests "*MapperServiceTest"

      - name: Run SqlWriterTests
        run: ./gradlew :app:test --tests "*SqlWriterServiceTest"

      - name: Run SessionTests
        run: ./gradlew :app:test --tests "*SessionServiceTest"

      - name: Run all tests and build ZIP distribution
        run: ./gradlew :app:test :app:distZip

      - name: Upload ZIP distribution
        uses: actions/upload-artifact@v4
        with:
          name: tchaofsql-${{ github.sha }}
          path: app/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

